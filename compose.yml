services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: satir
      POSTGRES_USER: satir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satir"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/satir
      DATABASE_USER: satir
      DATABASE_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL tanımlanmalı}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD tanımlanmalı}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlanmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
