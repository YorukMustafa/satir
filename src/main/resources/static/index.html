<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Satır: düşünceler, sinema ve hikâyeler için bağımsız yayın alanı."
    />
    <title>Satır — Merakın varsa, yerin burada.</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/theme.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header>
      <a class="logo" href="#" aria-label="Satır ana sayfa"
        >satır<span class="brand-mark" aria-hidden="true"
          ><i></i><i></i><i></i></span
      ></a>
      <div class="search">
        <span>⌕</span
        ><input
          id="search"
          aria-label="Yazı ara"
          placeholder="Merak ettiğin bir şeyi ara…"
        />
      </div>
      <nav id="account" aria-label="Hesap menüsü"></nav>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Koyu moda geç"
        aria-pressed="false"
        title="Koyu moda geç"
      >
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20.5 13.1A8.7 8.7 0 0 1 10.9 3.5 8.7 8.7 0 1 0 20.5 13.1Z"
          />
        </svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>
    </header>
    <div id="route-status" class="route-status" role="status" hidden>
      Yükleniyor…
    </div>
    <main id="app" tabindex="-1"></main>
    <footer>
      <a class="logo" href="#" aria-label="Satır ana sayfa"
        >satır<span class="brand-mark" aria-hidden="true"
          ><i></i><i></i><i></i></span
      ></a>
      <p>Merakın peşinden, satır satır.</p>
      <div class="footer-links">
        <a href="#about">Satır hakkında</a><a href="#">Ana sayfa ↑</a>
      </div>
      <span>Bağımsız seslere açık bir alan. © 2026 Satır</span>
    </footer>
    <dialog id="modal"></dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
